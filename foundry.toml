[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "osaka"
remappings = [
  "forge-std/=lib/forge-std/src/",
]
# Fork RPC: override with ETH_RPC_URL env var (default: publicnode)
[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
